<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFCF6">
<title>釜山＋福岡 過聖誕｜旅遊行程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFCF6;
  --ink:#3E3A39;
  --coral:#F2A497;
  --yellow:#F6D27A;
  --blue:#A8D3E6;
  --green:#B9DAA5;
  --coral-l:#FBDDD6;
  --yellow-l:#FBEBC3;
  --blue-l:#DDEEF6;
  --green-l:#E1F0D8;
  --line:3px solid var(--ink);
  --r:26px;
  --nav-h:58px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 12px);-webkit-text-size-adjust:100%}
body{
  font-family:"Huninn","Hiragino Maru Gothic ProN","Microsoft JhengHei","PingFang TC",sans-serif;
  background:var(--paper);color:var(--ink);line-height:1.65;font-size:16px;
  padding-bottom:env(safe-area-inset-bottom);
  padding-top:calc(var(--nav-h) + env(safe-area-inset-top));
}
body.editing{padding-bottom:150px}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
svg{display:block}
.s{stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
section{padding:34px 0 8px}

/* ---------- 選單 ---------- */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:50;height:var(--nav-h);
  background:var(--paper);border-bottom:var(--line);
  padding-top:env(safe-area-inset-top);box-sizing:content-box;
}
.nav-in{max-width:760px;margin:0 auto;height:var(--nav-h);display:flex;align-items:center;gap:8px;padding:0 12px}
.brand{flex:none;display:flex;align-items:center;gap:6px;font-size:17px;text-decoration:none;white-space:nowrap}
.brand svg{width:30px;height:30px}
.menu{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 2px;-webkit-overflow-scrolling:touch}
.menu::-webkit-scrollbar{display:none}
.menu a{
  flex:none;text-decoration:none;font-size:14px;padding:3px 12px;border-radius:999px;
  border:3px solid transparent;white-space:nowrap;
}
.menu a.on{background:var(--yellow);border-color:var(--ink)}
.edit-btn{flex:none;font-size:14px;padding:3px 12px;border:var(--line);border-radius:999px;background:var(--paper);white-space:nowrap;transition:transform .15s}
.edit-btn:active{transform:translateY(2px)}
body.editing .edit-btn{background:var(--coral)}
@media (max-width:420px){.brand span{display:none}}

/* ---------- 共用 ---------- */
.card{background:var(--paper);border:var(--line);border-radius:var(--r);padding:18px}
.sec-title{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:23px}
.sec-title i{
  font-style:normal;display:inline-grid;place-items:center;width:40px;height:40px;
  border:var(--line);border-radius:14px;font-size:20px;flex:none
}
.sec-sub{font-size:14px;opacity:.75;margin:-6px 0 14px}
.chip{display:inline-block;font-size:12.5px;line-height:1;padding:5px 10px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);white-space:nowrap}
.btn{
  display:inline-flex;align-items:center;gap:6px;font-size:14px;padding:6px 14px;
  background:var(--paper);border:var(--line);border-radius:999px;text-decoration:none;
  transition:transform .15s;
}
.btn:active{transform:translateY(2px)}
.btn.y{background:var(--yellow)}.btn.b{background:var(--blue)}.btn.c{background:var(--coral)}.btn.g{background:var(--green)}

/* ---------- 編輯模式元件 ---------- */
.ed{display:none !important}
body.editing .ed{display:flex !important}
.ctrls{gap:6px;margin-top:10px;flex-wrap:wrap}
.ib{
  width:36px;height:34px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);
  font-size:14px;line-height:1;display:grid;place-items:center;padding:0;transition:transform .15s;
}
.ib:active{transform:translateY(2px)}
.ib.e{background:var(--yellow)}.ib.d{background:var(--coral)}
.add-row{justify-content:center;margin-top:14px;gap:8px;flex-wrap:wrap}
.add-row .btn{border-style:dashed}
.edit-tip{font-size:13.5px;border:3px dashed var(--ink);border-radius:18px;padding:8px 12px;background:var(--yellow-l);margin-bottom:12px}
.toolbar{
  position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--paper);border-top:var(--line);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:none;gap:6px;flex-wrap:wrap;justify-content:center;
}
body.editing .toolbar{display:flex}
.toolbar .msg{width:100%;text-align:center;font-size:12.5px;opacity:.8;line-height:1.4}
.toolbar .btn{font-size:13px;padding:4px 11px}
#toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:90;
  background:var(--ink);color:var(--paper);border-radius:999px;padding:8px 18px;font-size:14px;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1);max-width:90vw;text-align:center;
}
body.editing #toast{bottom:calc(130px + env(safe-area-inset-bottom))}
#toast.show{opacity:1;transform:translate(-50%,0)}

dialog{
  border:var(--line);border-radius:var(--r);background:var(--paper);color:var(--ink);padding:0;
  width:min(92vw,480px);max-height:88vh;overflow:auto;margin:auto;font-family:inherit;
  box-shadow:0 6px 0 var(--ink);
}
dialog::backdrop{background:rgba(62,58,57,.35)}
dialog form{padding:18px}
dialog h3{font-size:20px;font-weight:400;margin-bottom:12px}
.fld{display:block;margin-bottom:12px;font-size:14px}
.fld>span{display:block;margin-bottom:3px}
.fld>span.opt{display:inline-flex;margin-bottom:0}
.fld small{opacity:.65;font-size:12px}
.fld input[type=text],.fld input[type=date],.fld input[type=datetime-local],.fld textarea,.fld select{
  width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);
  border:3px solid var(--ink);border-radius:14px;padding:7px 12px;
}
.fld textarea{min-height:84px;resize:vertical;line-height:1.5}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:3px solid var(--blue);outline-offset:1px}
.optgrid{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:inline-flex;align-items:center;gap:6px;border:3px solid var(--ink);border-radius:999px;padding:3px 12px;font-size:13.5px;cursor:pointer}
.opt input{width:16px;height:16px;accent-color:var(--green)}
.form-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}

/* ---------- 首頁 ---------- */
.hero{padding-top:22px}
.hero-card{border:var(--line);border-radius:34px;overflow:hidden;background:var(--blue-l);box-shadow:0 6px 0 var(--ink)}
.hero-art svg{width:100%;height:auto}
.hero-body{background:var(--paper);border-top:var(--line);padding:18px 18px 20px;text-align:center}
.eyebrow{display:inline-block;font-size:13px;background:var(--coral);border:3px solid var(--ink);border-radius:999px;padding:2px 12px}
.hero h1{font-size:clamp(28px,8vw,40px);line-height:1.25;margin:10px 0 4px;font-weight:400}
.hero p.sub{font-size:15px;opacity:.85}
.cd{margin-top:16px}
.cd-label{font-size:14px;margin-bottom:8px}
.cd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;margin:0 auto}
.cd-box{border:var(--line);border-radius:18px;padding:8px 0 6px}
.cd-box:nth-child(1){background:var(--coral)}
.cd-box:nth-child(2){background:var(--yellow)}
.cd-box:nth-child(3){background:var(--blue)}
.cd-box:nth-child(4){background:var(--green)}
.cd-box b{display:block;font-size:28px;line-height:1.1;font-weight:400;font-variant-numeric:tabular-nums}
.cd-box small{font-size:12px}
.cd-msg{display:none;font-size:18px;padding:12px;border:var(--line);border-radius:18px;background:var(--yellow-l)}
.route-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}

/* 插圖動畫 */
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
@keyframes fly{from{transform:translateX(-80px)}to{transform:translateX(440px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-40px)}}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}50%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.a-drift{animation:drift 9s ease-in-out infinite alternate}
.a-drift2{animation:drift 12s ease-in-out infinite alternate-reverse}
.a-fly{animation:fly 16s linear infinite}
.a-bob{animation:bob 3.2s ease-in-out infinite}
.a-bob2{animation:bob 4.4s ease-in-out infinite .6s}
.a-twinkle{animation:twinkle 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.a-twinkle2{animation:twinkle 2.8s ease-in-out infinite .8s;transform-box:fill-box;transform-origin:center}
.a-wave{animation:wave 4s linear infinite}
.a-steam{animation:steam 2.6s ease-in-out infinite}
.a-steam2{animation:steam 2.6s ease-in-out infinite 1.1s}
.a-sun{animation:spin 30s linear infinite;transform-box:fill-box;transform-origin:center}

/* ---------- 航班 ---------- */
.flights{display:grid;gap:16px}
.ticket{border:var(--line);border-radius:var(--r);background:var(--paper);overflow:hidden;box-shadow:0 5px 0 var(--ink)}
.t-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;border-bottom:3px dashed var(--ink)}
.t-head.c1{background:var(--coral)}.t-head.c2{background:var(--blue)}.t-head.c3{background:var(--green)}.t-head.c4{background:var(--yellow)}
.t-no{font-size:18px}
.t-main{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 16px 6px}
.t-city{text-align:center;flex:1}
.t-city b{display:block;font-size:22px;font-weight:400;line-height:1.3}
.t-city small{font-size:12.5px;opacity:.75}
.t-mid{flex:none;width:56px}
.t-mid svg{width:56px;height:24px}
.t-info{padding:4px 16px 16px;display:grid;gap:6px;font-size:14.5px}
.t-info div{display:flex;gap:8px;align-items:flex-start}
.t-info div::before{content:"";flex:none;margin-top:9px;border:3px solid var(--ink);border-radius:50%;background:var(--yellow);box-sizing:content-box;width:6px;height:6px}
.t-links{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 16px}
.ticket .ctrls{padding:0 16px 16px;margin-top:0}

/* ---------- 每日行程 ---------- */
.day-tabs{
  display:flex;gap:8px;overflow-x:auto;padding:6px 4px 12px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;
}
.day-tabs::-webkit-scrollbar{display:none}
.day-tab{
  flex:none;scroll-snap-align:center;min-width:68px;text-align:center;
  background:var(--paper);border:var(--line);border-radius:20px;padding:6px 10px 6px;line-height:1.25;
}
.day-tab b{display:block;font-weight:400;font-size:12.5px}
.day-tab span{font-size:17px}
.day-tab[aria-selected="true"]{background:var(--tab,var(--yellow));box-shadow:0 4px 0 var(--ink);transform:translateY(-2px)}
.day-tab.add{min-width:56px;border-style:dashed;align-self:stretch;display:none;place-items:center;font-size:22px}
@keyframes pop{0%{transform:translateY(-2px) scale(1)}35%{transform:translateY(-8px) scale(1.14)}65%{transform:translateY(0) scale(.95)}100%{transform:translateY(-2px) scale(1)}}
.day-tab.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes panelIn{0%{opacity:0;transform:translateY(26px) scale(.97)}55%{opacity:1;transform:translateY(-6px) scale(1.01)}80%{transform:translateY(2px)}100%{opacity:1;transform:none}}
.day-panel.pop{animation:panelIn .55s cubic-bezier(.3,1.5,.5,1)}
.day-head{display:flex;align-items:center;gap:14px;border:var(--line);border-radius:var(--r);padding:12px 14px;background:var(--hc,var(--coral-l));margin-bottom:18px}
.day-head .art{flex:none;width:96px;border:var(--line);border-radius:18px;background:var(--paper);overflow:hidden}
.day-head .art svg{width:100%;height:auto}
.day-head h3{font-size:20px;line-height:1.3;font-weight:400}
.day-head .meta{font-size:13.5px;opacity:.85;margin-bottom:2px}
.today{display:inline-block;background:var(--paper);border:3px solid var(--ink);border-radius:999px;font-size:12px;padding:0 8px;margin-left:6px;vertical-align:middle}
.day-ctrls{margin:-6px 0 16px}
.empty{border:3px dashed var(--ink);border-radius:var(--r);padding:20px;text-align:center;background:var(--yellow-l)}
.tl{list-style:none;position:relative;margin-left:8px;padding-left:0}
.tl::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;border-left:3px dashed var(--ink)}
.tl li{position:relative;padding:0 0 16px 38px}
.tl li::before{
  content:"";position:absolute;left:0;top:7px;width:19px;height:19px;border:var(--line);border-radius:50%;
  background:var(--yellow);box-sizing:border-box;
}
.tl li.must::before{background:var(--coral);width:21px;height:21px;left:-1px;top:6px}
.tl .time{font-size:13px;display:inline-block;background:var(--yellow-l);border:3px solid var(--ink);border-radius:999px;padding:0 9px;line-height:1.5;margin-bottom:4px}
.tl .box{border:var(--line);border-radius:20px;padding:10px 14px;background:var(--paper)}
.tl li.must .box{background:var(--coral-l)}
.tl .ttl{font-size:17px;line-height:1.4}
.tl .note{font-size:14px;opacity:.85;margin-top:2px;white-space:pre-line}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.tag{font-size:12px;line-height:1;padding:5px 9px;border:3px solid var(--ink);border-radius:999px}
.tag.rail{background:var(--green)}
.tag.train{background:var(--blue)}
.tag.bus{background:var(--yellow)}
.tag.air{background:var(--coral)}
.tag.boat{background:var(--blue-l)}
.tag.pass{background:var(--green-l)}
.tag.walk{background:var(--yellow-l)}
.must-badge{
  display:inline-block;font-size:12.5px;background:var(--coral);border:3px solid var(--ink);border-radius:999px;
  padding:0 9px;margin-left:6px;vertical-align:middle;line-height:1.5;animation:wiggle 2.6s ease-in-out infinite;
}
.map{font-size:12.5px;text-decoration:none;border:3px solid var(--ink);border-radius:999px;padding:3px 9px;line-height:1;background:var(--blue-l)}
.day-nav{display:flex;justify-content:space-between;gap:10px;margin-top:6px}

/* ---------- 待辦 / 清單 ---------- */
.lists{display:grid;gap:16px}
.list-card h3{font-size:18px;font-weight:400;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.list-card h3 em{font-style:normal;font-size:13px;margin-left:auto;border:3px solid var(--ink);border-radius:999px;padding:0 9px;background:var(--yellow-l)}
.bar{height:16px;border:var(--line);border-radius:999px;background:var(--paper);overflow:hidden;margin:0 0 12px}
.bar i{display:block;height:100%;width:0;background:var(--green);border-right:3px solid var(--ink);transition:width .35s cubic-bezier(.3,1.5,.5,1)}
.bar i.zero{border-right:0}
.checks{list-style:none;display:grid;gap:8px}
.checks label{
  display:flex;align-items:flex-start;gap:12px;padding:9px 12px;border:3px solid var(--ink);border-radius:18px;
  cursor:pointer;background:var(--paper);transition:background .2s,transform .15s;
}
.checks label:active{transform:scale(.98)}
.checks input{position:absolute;opacity:0;width:1px;height:1px}
.box-c{
  flex:none;width:26px;height:26px;border:var(--line);border-radius:9px;background:var(--paper);
  display:grid;place-items:center;margin-top:1px;transition:background .2s;
}
.box-c::after{
  content:"";width:7px;height:13px;border:solid var(--ink);border-width:0 3px 3px 0;transform:rotate(45deg) scale(0);
  margin-top:-3px;transition:transform .25s cubic-bezier(.3,1.8,.5,1);
}
.checks input:checked + .box-c{background:var(--green)}
.checks input:checked + .box-c::after{transform:rotate(45deg) scale(1)}
.checks input:checked ~ .txt{text-decoration:line-through;text-decoration-thickness:2px;opacity:.55}
.checks input:focus-visible + .box-c{outline:3px solid var(--blue);outline-offset:3px}
.checks .txt{line-height:1.5}
.checks .txt small{display:block;font-size:12.5px;opacity:.75;line-height:1.4}
.checks .ctrls{margin-top:6px}
.checks .ib{width:32px;height:30px;font-size:13px}
.reset{font-size:13px;margin-top:12px;padding:4px 12px;background:var(--paper);border:3px solid var(--ink);border-radius:999px}
.warn{border:var(--line);border-radius:20px;background:var(--yellow-l);padding:10px 14px;font-size:14.5px;margin-bottom:14px}

/* ---------- 住宿 ---------- */
.hotels{display:grid;gap:16px}
.hotel{border:var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 5px 0 var(--ink);background:var(--paper)}
.hotel-art{border-bottom:var(--line);background:var(--bg)}
.hotel-art svg{width:100%;height:auto;max-height:130px}
.hotel-body{padding:14px 18px 18px}
.hotel-body h3{font-size:19px;font-weight:400;line-height:1.4}
.hotel-body .jp{font-size:13.5px;opacity:.75}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 12px;font-size:14.5px}
.kv dt{opacity:.7}.kv dd{margin:0}

footer{text-align:center;padding:36px 16px 48px;font-size:14px}
footer svg{width:80px;margin:0 auto 8px}

@media (min-width:640px){
  .lists.two{grid-template-columns:1fr 1fr}
  .hotels{grid-template-columns:1fr 1fr}
  .day-head .art{width:120px}
}
body.editing .day-tab.add{display:grid !important}

/* ---------- 減少動態效果 ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important;scroll-behavior:auto !important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<!-- 頂端固定選單 -->
<header class="nav">
  <div class="nav-in">
    <a class="brand" href="#top" aria-label="回到首頁">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle class="s" cx="20" cy="20" r="16" fill="#F6D27A"/><path class="s" d="M20 9 L26 24 H14 Z" fill="#B9DAA5"/><path class="s" d="M20 16 L29 31 H11 Z" fill="#B9DAA5"/></svg>
      <span>聖誕釜福行</span>
    </a>
    <nav class="menu" id="menu" aria-label="頁面選單">
      <a href="#top" data-sec="top">首頁</a>
      <a href="#flights" data-sec="flights">航班</a>
      <a href="#itinerary" data-sec="itinerary">行程</a>
      <a href="#todo" data-sec="todo">待辦</a>
      <a href="#stay" data-sec="stay">住宿</a>
      <a href="#prep" data-sec="prep">出發前</a>
      <a href="#pack" data-sec="pack">行李</a>
    </nav>
    <button type="button" class="edit-btn" id="editToggle" data-act="toggleEdit" aria-pressed="false">✏️ 編輯</button>
  </div>
</header>

<main class="wrap">

<!-- 首頁 -->
<section id="top" class="hero">
  <div class="hero-card">
    <div class="hero-art">
      <svg viewBox="0 0 360 250" role="img" aria-label="插圖：釜山廣安大橋、海雲台高樓、聖誕樹與飛機">
        <rect width="360" height="250" fill="#DDEEF6"/>
        <g class="a-sun">
          <circle class="s" cx="290" cy="56" r="24" fill="#F6D27A"/>
          <g class="s" fill="none"><path d="M290 18v8M290 86v8M252 56h8M320 56h8M263 29l6 6M311 77l6 6M317 29l-6 6M269 77l-6 6"/></g>
        </g>
        <g class="a-drift"><path class="s" fill="#FFFCF6" d="M44 70 a14 14 0 0 1 8 -26 a18 18 0 0 1 34 -4 a14 14 0 0 1 14 30 z"/></g>
        <g class="a-drift2"><path class="s" fill="#FFFCF6" d="M170 52 a11 11 0 0 1 6 -20 a14 14 0 0 1 26 -3 a11 11 0 0 1 10 23 z"/></g>
        <g>
          <rect class="s" x="262" y="104" width="26" height="62" fill="#F6D27A"/>
          <rect class="s" x="288" y="84" width="30" height="82" fill="#F2A497"/>

  /* ---------- 日期 ---------- */
  function parseDate(s){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s||""); if(!m) return null;
    return {y:+m[1],m:+m[2],d:+m[3],w:new Date(Date.UTC(+m[1],+m[2]-1,+m[3])).getUTCDay()};
  }
  function dShort(s){ var p=parseDate(s); return p ? p.m+"/"+p.d : (s||"—"); }
  function dFull(s){ var p=parseDate(s); return p ? p.m+"/"+p.d+"（"+WEEK[p.w]+"）" : (s||""); }
  function localDate(){ var n=new Date(); return n.getFullYear()+"-"+pad(n.getMonth()+1)+"-"+pad(n.getDate()); }
  function todayIndex(){
    var t = localDate();
    for(var i=0;i<DATA.days.length;i++) if(DATA.days[i].date===t) return i;
    return -1;
  }
  function nextDate(s){
    var p = parseDate(s); if(!p) return "";
    var d = new Date(Date.UTC(p.y,p.m-1,p.d+1));
    return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate());
  }

  /* ---------- 倒數 ---------- */
  function tick(){
    var t = DATA.trip, start = new Date(t.start).getTime(), end = new Date(t.end).getTime(), now = Date.now();
    var grid=$("cdGrid"), msg=$("cdMsg"), lab=$("cdLabel");
    if(isNaN(start)){ grid.style.display="none"; msg.style.display="none"; lab.textContent=""; return; }
    var diff = start - now;
    if(diff > 0){
      var s = Math.floor(diff/1000);
      $("cdD").textContent = Math.floor(s/86400);
      $("cdH").textContent = pad(Math.floor(s%86400/3600));
      $("cdM").textContent = pad(Math.floor(s%3600/60));
      $("cdS").textContent = pad(s%60);
      lab.textContent = "距離出發" + (t.startNote ? "（"+t.startNote+"）" : "") + "還有";
      grid.style.display = "grid"; msg.style.display = "none";
    } else {
      grid.style.display = "none"; msg.style.display = "block"; lab.textContent = "";
      if(isNaN(end) || now <= end){
        var d = todayIndex();
        msg.textContent = "旅程進行中" + (d>=0 ? "・今天是 Day " + (d+1) : "") + " 🎄";
      } else msg.textContent = "旅程結束，歡迎回家 🏡";
    }
  }

  function fieldHtml(f,v){
    var val = v[f.k], name = esc(f.k), h = "";
    if(f.t==="check"){
      return '<label class="fld"><span class="opt"><input type="checkbox" name="'+name+'"'+(val?' checked':'')+'>'+esc(f.l)+'</span></label>';
    }
    h += '<label class="fld"><span>'+esc(f.l)+(f.h?' <small>'+esc(f.h)+'</small>':'')+'</span>';
    if(f.t==="area") h += '<textarea name="'+name+'" rows="4">'+esc(val)+'</textarea>';
    else if(f.t==="select") h += '<select name="'+name+'">'+f.o.map(function(o){return '<option value="'+esc(o[0])+'"'+(String(val)===String(o[0])?' selected':'')+'>'+esc(o[1])+'</option>';}).join("")+'</select>';
    else if(f.t==="tags") {
      h = '<div class="fld"><span>'+esc(f.l)+'</span><div class="optgrid">'+f.o.map(function(o){
        return '<label class="opt"><input type="checkbox" name="'+name+'" value="'+esc(o[0])+'"'+((val||[]).indexOf(o[0])>=0?' checked':'')+'>'+esc(o[1])+'</label>';
      }).join("")+'</div></div>';
      return h;
    }
    else h += '<input type="'+(f.t==="date"?"date":f.t==="dt"?"datetime-local":"text")+'" name="'+name+'" value="'+esc(val)+'"'+(f.ph?' placeholder="'+esc(f.ph)+'"':'')+(f.req?' required':'')+' autocomplete="off">';
    return h + '</label>';
  }
  function openForm(title,fields,vals,onSave){
    dlg.innerHTML = '<form><h3>'+esc(title)+'</h3>'+fields.map(function(f){return fieldHtml(f,vals);}).join("")+
      '<div class="form-btns"><button type="button" class="btn" data-close>取消</button><button type="submit" class="btn y">儲存</button></div></form>';
    var form = dlg.querySelector("form");
    form.addEventListener("submit",function(e){
      e.preventDefault();
      var out = {};
      fields.forEach(function(f){
        if(f.t==="check") out[f.k] = form.elements[f.k].checked;
        else if(f.t==="tags") out[f.k] = Array.prototype.filter.call(form.querySelectorAll('input[name="'+f.k+'"]'),function(x){return x.checked;}).map(function(x){return x.value;});
        else out[f.k] = form.elements[f.k].value.trim();
      });
      dlg.close(); onSave(out);
    });
    dlg.querySelector("[data-close]").addEventListener("click",function(){ dlg.close(); });
    if(!dlg.open){ if(dlg.showModal) dlg.showModal(); else dlg.setAttribute("open",""); }
    dlg.scrollTop = 0;
  }

      return '<article class="hotel"><div class="hotel-art" style="--bg:var(--'+nm+'-l)">'+HOTEL_ART[i%2]+'</div><div class="hotel-body">'+
        (h.chip?'<span class="chip" style="background:var(--'+nm+')">'+esc(h.chip)+'</span>':'')+
        '<h3 style="margin-top:8px">'+esc(h.name)+'</h3>'+(h.jp?'<div class="jp">'+esc(h.jp)+'</div>':'')+
        '<dl class="kv">'+h.kv.map(function(p){return '<dt>'+esc(p[0])+'</dt><dd>'+esc(p[1])+'</dd>';}).join("")+'</dl>'+
        (h.map?'<a class="btn '+(c%2?'y':'b')+'" href="'+mapUrl(h.map)+'" target="_blank" rel="noopener">📍 開啟地圖</a>':'')+
        ctrls("hotel",'data-i="'+i+'"')+'</div></article>';
    }).join("");
  }
  function editHotel(i){
    var isNew = i<0, h = isNew ? {id:uid(),chip:"",name:"",jp:"",kv:[],map:"",color:1} : DATA.hotels[i];
    openForm(isNew?"新增住宿":"編輯住宿",[
      {k:"chip",l:"標籤",ph:"釜山・3 晚"},{k:"name",l:"飯店名稱",req:1},{k:"jp",l:"原文／英文名稱"},
      {k:"kv",l:"詳細資訊",t:"area",h:"一行一個：項目|內容，例如 入住|12/26 15:30"},
      {k:"map",l:"地圖搜尋關鍵字"},{k:"color",l:"卡片顏色",t:"select",o:COLOR_OPTS}
    ],{chip:h.chip,name:h.name,jp:h.jp,kv:h.kv.map(function(p){return p[0]+"|"+p[1];}).join("\n"),map:h.map,color:h.color||1},function(v){
      h.chip=v.chip; h.name=v.name; h.jp=v.jp; h.map=v.map; h.color=+v.color;
      h.kv = lines(v.kv).map(function(s){ var p=s.split("|"); return [p[0].trim(), p.slice(1).join("|").trim()]; });
      if(isNew) DATA.hotels.push(h);
      commit();
    });
  }

  /* ---------- 清單 ---------- */
  var HOSTS = {todo:"todoLists",prep:"prepLists",pack:"packLists"};
  function renderLists(){
    Object.keys(HOSTS).forEach(function(g){
      $(HOSTS[g]).innerHTML = DATA.lists[g].map(function(L,l){
        return '<article class="card list-card" style="'+(L.wide?'grid-column:1/-1':'')+'">'+
          '<h3><span aria-hidden="true">'+esc(L.icon||"📌")+'</span>'+esc(L.title)+'<em id="n_'+esc(L.id)+'"></em></h3>'+
          ctrls("list",'data-g="'+g+'" data-i="'+l+'"')+
          '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="p_'+esc(L.id)+'" style="width:0%"></i></div>'+
          '<ul class="checks">'+L.items.map(function(it,i){
            return '<li><label><input type="checkbox" data-id="'+esc(it.id)+'" data-list="'+esc(L.id)+'"'+(CHECK[it.id]?' checked':'')+'>'+
              '<span class="box-c" aria-hidden="true"></span><span class="txt">'+esc(it.t)+(it.n?'<small>'+esc(it.n)+'</small>':'')+'</span></label>'+
              ctrls("li",'data-g="'+g+'" data-l="'+l+'" data-i="'+i+'"')+'</li>';
          }).join("")+'</ul>'+
          '<div class="ed add-row" style="margin-top:10px"><button type="button" class="btn g" data-act="addLI" data-g="'+g+'" data-l="'+l+'">＋ 新增項目</button></div>'+
          '<button type="button" class="reset" data-act="resetList" data-g="'+g+'" data-l="'+l+'">全部取消勾選</button></article>';
      }).join("");
    });
    Object.keys(HOSTS).forEach(function(g){ DATA.lists[g].forEach(function(L){ updateProgress(L); }); });
  }
  function updateProgress(L){
    var done = 0, total = L.items.length;
    L.items.forEach(function(it){ if(CHECK[it.id]) done++; });
    var pct = total ? Math.round(done/total*100) : 0, bar = $("p_"+L.id);
    if(!bar) return;
    bar.style.width = pct+"%"; bar.className = pct===0 ? "zero" : "";
    bar.parentNode.setAttribute("aria-valuenow",pct);
    $("n_"+L.id).textContent = done+" / "+total;
  }
  function findList(id){
    var r=null; Object.keys(HOSTS).forEach(function(g){ DATA.lists[g].forEach(function(L){ if(L.id===id) r=L; }); }); return r;
  }
  document.addEventListener("change",function(e){
    var b = e.target; if(!b.matches || !b.matches("input[data-id]")) return;
    if(b.checked) CHECK[b.getAttribute("data-id")] = 1; else delete CHECK[b.getAttribute("data-id")];
    lsSet("checks",CHECK);
    var L = findList(b.getAttribute("data-list")); if(L) updateProgress(L);
  });
  function editList(g,l){
    var isNew = l<0, L = isNew ? {id:uid(),icon:"📌",title:"",items:[]} : DATA.lists[g][l];
    openForm(isNew?"新增清單":"編輯清單",[{k:"icon",l:"圖示（emoji）"},{k:"title",l:"清單名稱",req:1}],{icon:L.icon,title:L.title},function(v){
      L.icon=v.icon||"📌"; L.title=v.title; if(isNew) DATA.lists[g].push(L); commit();
    });
  }
  function editLI(g,l,i){
    var L = DATA.lists[g][l]; if(!L) return;
    var isNew = i<0, it = isNew ? {id:uid(),t:"",n:""} : L.items[i];
    openForm(isNew?"新增項目":"編輯項目",[{k:"t",l:"項目",req:1},{k:"n",l:"備註"}],{t:it.t,n:it.n},function(v){
      it.t=v.t; it.n=v.n; if(isNew) L.items.push(it); commit();
    });
  }

  /* ---------- 控制：編輯／刪除／移動 ---------- */
  function ctl(d){
    var op=d.op, k=d.k, i=+d.i, arr, ok;
    function del(label,after){
      if(!confirm("確定刪除這個"+label+"？")) return;
      arr.splice(i,1); if(after) after(); commit();
    }
    if(k==="flight"){ arr=DATA.flights; if(op==="edit") return editFlight(i); if(op==="del") return del("航班"); if(swap(arr,i,i+(op==="up"?-1:1))) commit(); }
    else if(k==="hotel"){ arr=DATA.hotels; if(op==="edit") return editHotel(i); if(op==="del") return del("住宿"); if(swap(arr,i,i+(op==="up"?-1:1))) commit(); }
    else if(k==="day"){
      arr=DATA.days;
      if(op==="del") return del("整天行程（含所有項目）",function(){ if(cur>=arr.length) cur=arr.length-1; });
      var n = i+(op==="up"?-1:1); if(swap(arr,i,n)){ cur=n; commit(); }
    }
    else if(k==="item"){ var day=DATA.days[cur]; if(!day) return; arr=day.items; if(op==="edit") return editItem(i); if(op==="del") return del("行程"); if(swap(arr,i,i+(op==="up"?-1:1))) commit(); }
    else if(k==="list"){ arr=DATA.lists[d.g]; if(op==="edit") return editList(d.g,i); if(op==="del") return del("清單"); if(swap(arr,i,i+(op==="up"?-1:1))) commit(); }
    else if(k==="li"){ var L=DATA.lists[d.g][+d.l]; if(!L) return; arr=L.items; if(op==="edit") return editLI(d.g,+d.l,i); if(op==="del") return del("項目"); if(swap(arr,i,i+(op==="up"?-1:1))) commit(); }
  }

  /* ---------- 匯出／匯入／下載 ---------- */
  function download(name,text,type){
    var blob = new Blob([text],{type:type}), a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1000);
  }
  function seedJson(){ return JSON.stringify(DATA).replace(/<\//g,"<\\/"); }
  function dlHtml(){
    var re = /<script type="application\/json" id="seed">[\s\S]*?<\/script>/;
    if(!re.test(SRC)){ toast("無法產生網頁，請改用「匯出資料」"); return; }
    var html = SRC.replace(re,function(){ return '<script type="application/json" id="seed">'+seedJson()+'</'+'script>'; });
    download("index.html",html,"text/html");
    toast("已下載 index.html，拿去重新上傳即可更新公開網頁");
  }

  /* ---------- 點擊分派 ---------- */
  var ACTS = {
    toggleEdit:function(){
      var on = !document.body.classList.contains("editing");
      document.body.classList.toggle("editing",on);
      $("editToggle").setAttribute("aria-pressed",on);
      $("editToggle").textContent = on ? "✓ 完成" : "✏️ 編輯";
      toast(on ? "編輯模式已開啟" : "已離開編輯模式");
    },
    selDay:function(d){ select(+d.i,true,!!d.scroll); },
    addDay:function(){ editDay(-1); }, editDay:function(){ editDay(cur); },
    addItem:function(){ editItem(-1); },
    addFlight:function(){ editFlight(-1); }, addHotel:function(){ editHotel(-1); },
    addList:function(d){ editList(d.g,-1); },
    addLI:function(d){ editLI(d.g,+d.l,-1); },
    editTrip:editTrip, ctl:ctl,
    resetList:function(d){
      var L = DATA.lists[d.g][+d.l]; if(!L) return;
      L.items.forEach(function(it){ delete CHECK[it.id]; });
      lsSet("checks",CHECK);
      Array.prototype.forEach.call(document.querySelectorAll('input[data-list="'+L.id+'"]'),function(c){ c.checked=false; });
      updateProgress(L);
    },
    dlHtml:dlHtml,
    exportJson:function(){ download("trip-data.json",JSON.stringify(DATA,null,2),"application/json"); toast("已匯出 trip-data.json"); },
    importJson:function(){ $("fileIn").click(); },
    reset:function(){
      if(!confirm("要放棄這個瀏覽器裡的修改，還原成網頁檔內建的內容嗎？")) return;
      DATA = clone(SEED); normalize(); lsDel("data"); cur = 0; renderAll(); toast("已還原");
    }
  };
  document.addEventListener("click",function(e){
    var b = e.target.closest ? e.target.closest("[data-act]") : null;
    if(!b || !ACTS[b.getAttribute("data-act")]) return;
    ACTS[b.getAttribute("data-act")](b.dataset,b);
  });
  $("fileIn").addEventListener("change",function(e){
    var f = e.target.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try{
        var o = JSON.parse(r.result);
        if(!validShape(o)) throw new Error("格式不符");
        DATA = o; normalize(); cur = 0; commit(); toast("✓ 已匯入");
      }catch(err){ toast("匯入失敗：檔案格式不正確"); }
    };
    r.readAsText(f); e.target.value = "";
  });

  /* ---------- 選單高亮 ---------- */
  function spy(){
    var links = document.querySelectorAll("#menu a"), ids = ["top","flights","itinerary","todo","stay","prep","pack"];
    var active = ids[0];
    ids.forEach(function(id){ var s=$(id); if(s && s.getBoundingClientRect().top <= 110) active=id; });
    if(window.innerHeight + window.scrollY >= document.body.scrollHeight - 4) active = "pack";
    links.forEach(function(a){
      var on = a.getAttribute("data-sec")===active;
      a.classList.toggle("on",on);
      if(on){ a.setAttribute("aria-current","true");
        var m=$("menu"); var l=a.offsetLeft-(m.clientWidth-a.offsetWidth)/2; if(Math.abs(m.scrollLeft-l)>40) m.scrollTo({left:l,behavior:reduce.matches?"auto":"smooth"}); }
      else a.removeAttribute("aria-current");
    });
  }
  var ticking=false;
  window.addEventListener("scroll",function(){ if(!ticking){ ticking=true; requestAnimationFrame(function(){ spy(); ticking=false; }); } },{passive:true});

  /* ---------- 啟動 ---------- */
  function renderAll(){ renderTrip(); renderFlights(); renderItin(); renderHotels(); renderLists(); tick(); }
  var ti = todayIndex(); cur = ti>=0 ? ti : 0;
  renderAll(); setInterval(tick,1000); spy();
})();
</script>
</body>
</html>
